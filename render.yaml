# Render Blueprint for AIvana OS - Cancer Care.
# One service: the FastAPI backend, which also serves frontend/** directly (see
# backend/app/main.py) -- there is no separate static site or serverless function to define.
#
# Native Python runtime, not Docker: every dependency (including document OCR -- see
# ocr_service.py's module docstring) installs via pip alone, so there's no system package
# (apt-get) or Docker build step to get right. If that ever changes, switch `runtime: python`
# to `runtime: docker` with a Dockerfile, but don't add one speculatively.
#
# Secrets (DATABASE_URL, GROQ_API_KEY, SARVAM_API_KEY, ALLOWED_ORIGINS, ADMIN_EMAIL,
# ADMIN_PASSWORD) are intentionally left `sync: false` -- Render will prompt for these in the
# dashboard on first deploy rather than storing them in this version-controlled file.
# SECRET_KEY is auto-generated by Render; do not override it with the insecure tutorial-default
# value (config.py refuses to start if you do).

services:
  - type: web
    name: aivana-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    # `starter` (~512MB RAM) OOMs the moment a real (image-based/scanned) document hits
    # actual docTR inference -- OCR_BENCHMARK.md, which is what justified choosing docTR as
    # this app's OCR engine, measured it at ~2.1GB RSS during inference and explicitly states
    # its target is an "8GB CPU deployment". `starter` was never big enough for the engine
    # this app actually ships; confirmed in production as every document upload silently
    # failing OCR (or the request/process dying) on anything but a synthetic, embedded-text
    # PDF. `pro plus` is Render's tier matching that 8GB target as of this writing -- verify
    # the current plan-to-RAM mapping in the Render dashboard/pricing page before deploying,
    # since Render's tier names/specs can change, and note that changing this file alone does
    # not move an already-running service to the new plan -- apply it via Sync, or change the
    # plan directly on the existing service in the Render dashboard.
    plan: pro plus
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TRANSCRIPTION_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: MAX_PATIENT_DOCUMENT_MB
        value: "25"
      # First Admin account, auto-seeded on a fresh (empty) database at startup -- see
      # backend/app/main.py's create_default_user(). Leave both blank to skip the seed and
      # register the first Admin manually via POST /api/auth/register instead.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
