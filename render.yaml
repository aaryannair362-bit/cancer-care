# Render Blueprint for AIvana OS - Cancer Care.
# One service: the FastAPI backend, which also serves frontend/** directly (see
# backend/app/main.py) -- there is no separate static site or serverless function to define.
#
# Native Python runtime, not Docker: every dependency (including document OCR -- see
# ocr_service.py's module docstring) installs via pip alone, so there's no system package
# (apt-get) or Docker build step to get right. If that ever changes, switch `runtime: python`
# to `runtime: docker` with a Dockerfile, but don't add one speculatively.
#
# Secrets (DATABASE_URL, GROQ_API_KEY, GEMINI_API_KEY, SARVAM_API_KEY, SARVAM_OCR_API_KEY,
# SARVAM_STT_API_KEY, ALLOWED_ORIGINS, ADMIN_EMAIL, ADMIN_PASSWORD) are intentionally left
# `sync: false` -- Render
# will prompt for these in the dashboard on first deploy rather than storing them in this
# version-controlled file.
# SECRET_KEY is auto-generated by Render; do not override it with the insecure tutorial-default
# value (config.py refuses to start if you do).

services:
  - type: web
    name: aivana-os
    runtime: python
    # RapidOCR (see requirements.txt) transitively depends on `opencv-python`, the GUI-enabled
    # build -- on Linux it links Qt/GTK/X11 shared libraries that get loaded into memory at
    # import time even though this is a headless server that never calls a GUI function. That's
    # a well-documented, often 150-300MB+ difference from `opencv-python-headless`, the drop-in
    # server-oriented replacement (identical `cv2` API for everything RapidOCR actually calls).
    # pip's resolver can't be told "install opencv-python-headless instead of opencv-python" from
    # requirements.txt alone (they're different package names, so both would install and fight
    # over the same site-packages/cv2 files) -- explicitly uninstalling the GUI build and
    # installing headless after the main install is the standard, deterministic fix.
    buildCommand: pip install -r requirements.txt && pip uninstall -y opencv-python && pip install opencv-python-headless==5.0.0.93
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    # History: `starter` (~512MB RAM) OOM'd on real docTR OCR inference, confirmed live in
    # production twice on 31 Aug 2026 ("ran out of memory (used over 512MB)"). That was traced to
    # docTR's torch dependency (`import torch` alone costs ~175MB RSS before any model loads;
    # both docTR architectures tried peaked at 572-597MB total -- see OCR_BENCHMARK.md's
    # "Architecture comparison" and "Engine reconsidered for memory ceiling" sections), not to the
    # ~2.1GB figure an earlier version of this comment misattributed to docTR (that number was
    # actually PaddleOCR's, per OCR_BENCHMARK.md's own "Measured results" section).
    #
    # `ocr_service.py` has since moved off docTR entirely to RapidOCR (no torch dependency),
    # measured at ~154MB peak RSS with the same methodology -- comfortably under `starter`'s
    # 512MB even with this app's own FastAPI/uvicorn overhead added, at a real, knowingly-accepted
    # accuracy cost (see that module's docstring). `pro plus` here was sized for docTR's ~600MB
    # need, which no longer applies -- `starter` is worth re-testing now that OCR itself needs far
    # less memory, but real (messier/larger) documents and multiple concurrent uploads (each
    # running OCR off the request thread -- see cca.py/patient_documents.py) both add to the
    # 154MB single-job baseline measured on clean synthetic PDFs, so confirm with real traffic
    # before downgrading. Verify the current plan-to-RAM mapping in the Render dashboard/pricing
    # page before deploying, and note that changing this file alone does not move an
    # already-running service to a new plan -- apply it via Sync, or change the plan directly on
    # the existing service in the dashboard.
    plan: pro plus
    healthCheckPath: /api/health
    envVars:
      # glibc's malloc creates per-thread memory arenas (default up to 8x CPU count on 64-bit
      # Linux) that generally never shrink back to the OS once grown -- a well-documented cause
      # of long-running Python services with heavy native-extension memory churn (numpy/opencv/
      # onnxruntime, exactly what OCR does) showing RSS that ratchets upward over a process's
      # lifetime with no actual code-level leak. This process is a single persistent worker
      # (WEB_CONCURRENCY=1, per Render's own build log) handling many requests over its uptime,
      # not a fresh process per request -- so a peak from one OCR call can raise the floor every
      # later request inherits, even a small one. Capping arenas to 1 is the standard fix for
      # this class of symptom; it cannot be verified against this exact container from outside
      # it, but it's a pure env var with no functional/correctness risk.
      - key: MALLOC_ARENA_MAX
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GROQ_API_KEY
        sync: false
      # Document OCR AI-extraction (extract_clinical_facts / classify_and_extract_page in
      # cca_engine.py) -- required for a document upload to draft any diagnoses/medications/
      # findings at all. Previously this slot was GROQ_API_KEY_OCR (a dedicated Groq account
      # for the same workload); that env var is DEAD CODE now (removed from config.py entirely
      # once document OCR AI-extraction moved to Gemini, see that file's own GEMINI_API_KEY
      # comment) -- rotating GROQ_API_KEY_OCR in the Render dashboard has no effect on OCR
      # extraction. If this key is missing, invalid, or the Gemini project's quota is
      # exhausted, extraction fails silently per-chunk (by design -- see
      # extract_clinical_facts_with_identity's docstring) and the document still uploads
      # successfully with zero drafted facts; check for "Gemini API error" / "RESOURCE_EXHAUSTED"
      # / "429" in the service logs around the upload time to distinguish a bad key from an
      # exhausted quota.
      - key: GEMINI_API_KEY
        sync: false
      # Optional override -- see config.py's GEMINI_MODEL comment for why this is env-overridable
      # (a model retirement should be a dashboard edit, not a code deploy). Leave unset to use
      # the code default.
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TRANSCRIPTION_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      # Dedicated per-feature Sarvam keys (recommended over the shared SARVAM_API_KEY above) --
      # OCR (Document AI) and STT (Scribe's audio transcription) are billed/rate-limited
      # independently on Sarvam's side per key. Each falls back to SARVAM_API_KEY when unset --
      # see config.py. Leave blank in the Render dashboard to keep using the shared key.
      - key: SARVAM_OCR_API_KEY
        sync: false
      - key: SARVAM_STT_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Matches config.py's own default exactly -- Sarvam Document AI's own accepted upload
      # size (200MB, docs.sarvam.ai). Was "25" here, silently overriding the 200MB code default
      # via this env var -- fixed 2026-09-15, found while investigating a production report of
      # large real scanned hospital records failing to upload.
      - key: MAX_PATIENT_DOCUMENT_MB
        value: "200"
      # First Admin account, auto-seeded on a fresh (empty) database at startup -- see
      # backend/app/main.py's create_default_user(). Leave both blank to skip the seed and
      # register the first Admin manually via POST /api/auth/register instead.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
