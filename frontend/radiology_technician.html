<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivana — Radiology Technician</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F1F5F9; --bg-sidebar: #EEF2F6; --bg-surface: #FFFFFF; --bg-card-subtle: #F8FAFC;
            --ink-900: #0F172A; --ink-800: #1E293B; --ink-700: #334155; --ink-600: #475569; --ink-500: #64748B; --ink-400: #94A3B8; --ink-300: #CBD5E1;
            --line: #E2E8F0; --line-subtle: #F1F5F9;
            --navy-action: #2A4365; --navy-action-hover: #1E3A8A;
            --green-badge-bg: #DCFCE7; --green-badge-text: #166534;
            --amber-badge-bg: #FEF3C7; --amber-badge-text: #92400E;
            --rose-badge-bg: #FFE4E6; --rose-badge-text: #9F1239;
            --blue-badge-bg: #E0E7FF; --blue-badge-text: #3730A3;
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05); --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-page); color: var(--ink-800); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
        .topbar { height: 64px; background: var(--bg-surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 20; }
        .brand-logo { font-size: 20px; font-weight: 700; color: var(--ink-900); letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .icon-circle-btn { width: 38px; height: 38px; border-radius: var(--radius-full); border: 1px solid var(--line); background: var(--bg-surface); display: flex; align-items: center; justify-content: center; color: var(--ink-600); cursor: pointer; }
        .role-badge-pill { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #F8FAFC; border: 1px solid var(--line); border-radius: var(--radius-full); font-size: 13px; font-weight: 500; color: var(--ink-800); cursor: pointer; }
        .avatar-pill { width: 38px; height: 38px; border-radius: var(--radius-full); background: #E2E8F0; color: var(--ink-800); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; border: 1px solid var(--line); cursor: pointer; }
        .app-body { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; overflow-y: auto; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: var(--ink-400); text-transform: uppercase; padding: 10px 12px 6px; }
        .sidebar-nav-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 500; color: var(--ink-700); text-decoration: none; cursor: pointer; }
        .sidebar-nav-item:hover { background: rgba(255, 255, 255, 0.6); color: var(--ink-900); }
        .sidebar-nav-item.active { background: #FFFFFF; color: var(--ink-900); font-weight: 600; box-shadow: var(--shadow-sm); border: 1px solid rgba(226, 232, 240, 0.8); }
        .nav-item-left { display: flex; align-items: center; gap: 10px; }
        .nav-chevron { color: var(--ink-400); font-size: 12px; }
        .canvas { flex: 1; overflow-y: auto; padding: 28px 36px; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .page-title { font-size: 26px; font-weight: 700; color: var(--ink-900); letter-spacing: -0.5px; margin-bottom: 4px; }
        .page-subtitle { font-size: 13.5px; color: var(--ink-500); margin-bottom: 20px; }
        .section-card { background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title { font-size: 16px; font-weight: 700; color: var(--ink-900); }
        .section-sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
        .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; }
        .badge-green { background: var(--green-badge-bg); color: var(--green-badge-text); }
        .badge-amber { background: var(--amber-badge-bg); color: var(--amber-badge-text); }
        .badge-rose { background: var(--rose-badge-bg); color: var(--rose-badge-text); }
        .badge-blue { background: var(--blue-badge-bg); color: var(--blue-badge-text); }
        .btn-navy { background: var(--navy-action); color: #FFFFFF; font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-navy:hover { background: var(--navy-action-hover); }
        .btn-outline { background: #FFFFFF; border: 1px solid var(--line); color: var(--ink-700); font-size: 12.5px; font-weight: 600; padding: 9px 14px; border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-outline:hover { border-color: var(--ink-400); background: #F8FAFC; }
        .form-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-800); margin-bottom: 10px; }
        .worklist-row { background: var(--bg-card-subtle); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 10px; display: grid; grid-template-columns: 1.3fr 1fr 1fr 0.8fr auto; gap: 14px; align-items: center; }
        .wl-label { font-size: 11px; color: var(--ink-500); text-transform: uppercase; margin-bottom: 2px; }
        .wl-value { font-size: 13.5px; font-weight: 700; color: var(--ink-900); }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--ink-700); }
        .form-input, .form-select, .form-textarea { width: 100%; height: 38px; padding: 0 12px; background: #FFFFFF; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 13px; color: var(--ink-900); outline: none; }
        .form-textarea { height: auto; padding: 10px 12px; }
        .hms-toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink-900); color: #fff; padding: 12px 18px; border-radius: var(--radius-md); font-size: 13px; box-shadow: var(--shadow-md); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 999; max-width: 360px; }
        .hms-toast--visible { opacity: 1; transform: translateY(0); }
        .hms-toast--success { background: var(--green-badge-text); }
        .hms-toast--error { background: var(--rose-badge-text); }
        .hms-toast--info { background: var(--blue-badge-text); }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/radiology_technician.html" class="brand-logo">Aivana</a>
        <div style="flex:1;"></div>
        <div class="header-actions">
            <button class="icon-circle-btn" title="Notifications">🔔</button>
            <div class="role-badge-pill" onclick="location.href='/index.html'"><span>Radiology Technician</span><span>▾</span></div>
            <div class="avatar-pill" title="Logged in">RT ▾</div>
        </div>
    </header>
    <div class="app-body">
        <aside class="sidebar">
            <div class="sidebar-section-title">IMAGING</div>
            <a class="sidebar-nav-item active" id="nav-worklist" onclick="showTab('worklist')"><div class="nav-item-left"><span>🩻</span><span>Technical Worklist</span></div><span class="nav-chevron">›</span></a>
        </aside>
        <main class="canvas">

            <div id="view-worklist" class="view-panel active">
                <h1 class="page-title">Technical Worklist</h1>
                <p class="page-subtitle">Imaging orders scheduled and prepared, awaiting acquisition. Verify patient identity/study, perform the scan, and hand off to the Radiologist for interpretation.</p>
                <div id="worklist-content"><!-- Populated via JS: loadTechnicalWorklist() --></div>
            </div>

        </main>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        const ccaUser = Auth.requirePage(['CCARadiologyTechnician', 'Admin']);
        const CCA_API = '/cca';

        function showTab(tab) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
            if (tab === 'worklist') loadTechnicalWorklist();
        }

        async function loadTechnicalWorklist() {
            const container = document.getElementById('worklist-content');
            try {
                const data = await Api.get(`${CCA_API}/imaging/technical-worklist`);
                container.innerHTML = `<div class="section-card"><div class="section-title" style="margin-bottom:14px;">Awaiting Acquisition</div>` +
                    (data.worklist.length ? data.worklist.map(o => `
                        <div class="worklist-row">
                            <div><div class="wl-label">Patient</div><div class="wl-value">${escapeHtml(o.patient_name)}</div><div style="font-size:12px;color:var(--ink-500);">${escapeHtml(o.patient_mrn)}</div></div>
                            <div><div class="wl-label">Study</div><div class="wl-value" style="font-size:13px;">${escapeHtml(o.item_name)}</div></div>
                            <div><div class="wl-label">Location</div><div class="wl-value" style="font-size:13px;">${escapeHtml(o.location || '—')}</div></div>
                            <div><span class="badge ${o.acquisition_status === 'InProgress' ? 'badge-amber' : 'badge-blue'}">${escapeHtml(o.acquisition_status || 'NotStarted')}</span></div>
                            <div><button class="btn-navy" onclick="openAcquisition(${Number(o.id)})">Open</button></div>
                        </div>
                    `).join('') : '<p style="color:var(--ink-500); font-size:13px;">No studies currently awaiting acquisition.</p>') + `</div>
                    <div class="section-card" id="acquisition-detail"></div>`;
            } catch (err) { container.innerHTML = `<div class="section-card"><p style="color:var(--rose-badge-text); font-size:13px;">${escapeHtml(apiErrorMessage(err))}</p></div>`; }
        }

        let currentAcquisitionOrderId = null;

        async function openAcquisition(orderId) {
            currentAcquisitionOrderId = orderId;
            const detail = document.getElementById('acquisition-detail');
            try {
                const data = await Api.get(`${CCA_API}/imaging/orders/${orderId}`);
                const o = data.order;
                detail.innerHTML = `
                    <div class="section-title">${escapeHtml(o.item_name)}</div>
                    <div class="section-sub" style="margin-bottom:14px;">Indication: ${escapeHtml(o.clinical_indication || 'Not recorded')} · Scheduled: ${o.scheduled_at ? escapeHtml(o.scheduled_at.slice(0, 16).replace('T', ' ')) : 'Not scheduled'} · Location: ${escapeHtml(o.location || '—')}</div>

                    <div class="section-card" style="background:var(--bg-card-subtle); margin-bottom:14px;">
                        <div class="section-sub" style="margin-bottom:8px; font-weight:700; color:var(--ink-800);">Identity / Study Verification</div>
                        <div class="form-checkbox-row"><input type="checkbox" id="acq-idcheck-${orderId}"/> <label for="acq-idcheck-${orderId}">Patient identity verified against order</label></div>
                        <div class="form-checkbox-row"><input type="checkbox" id="acq-studycheck-${orderId}"/> <label for="acq-studycheck-${orderId}">Requested study/protocol confirmed</label></div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group"><label class="form-label">Modality</label><input type="text" id="acq-modality-${orderId}" class="form-input" placeholder="e.g. CT, MRI, X-ray" value="${escapeHtml(o.acquisition_modality || '')}" /></div>
                        <div class="form-group"><label class="form-label">Protocol</label><input type="text" id="acq-protocol-${orderId}" class="form-input" placeholder="e.g. Contrast-enhanced chest" value="${escapeHtml(o.acquisition_protocol || '')}" /></div>
                    </div>
                    <div class="form-checkbox-row"><input type="checkbox" id="acq-contrast-${orderId}" ${o.contrast_used ? 'checked' : ''}/> <label for="acq-contrast-${orderId}">Contrast used</label></div>
                    <div class="form-group" style="margin-bottom:14px;"><label class="form-label">Contrast notes (reaction, volume, agent)</label><textarea id="acq-contrastnotes-${orderId}" class="form-textarea" rows="2">${escapeHtml(o.contrast_notes || '')}</textarea></div>
                    <div class="form-group" style="margin-bottom:14px;"><label class="form-label">Technical notes</label><textarea id="acq-technotes-${orderId}" class="form-textarea" rows="2">${escapeHtml(o.technical_notes || '')}</textarea></div>
                    <div class="form-group" style="margin-bottom:16px;"><label class="form-label">Issue / incomplete study (if any)</label><textarea id="acq-issue-${orderId}" class="form-textarea" rows="2" placeholder="e.g. patient could not tolerate the study, motion artifact">${escapeHtml(o.technical_issue || '')}</textarea></div>

                    <button class="btn-outline" onclick="submitAcquisition(${orderId}, 'InProgress')">Save Progress</button>
                    <button class="btn-navy" onclick="submitAcquisition(${orderId}, 'Completed')">✓ Mark Acquisition Complete — Hand off to Radiologist</button>
                    <button class="btn-outline" style="border-color:var(--rose-badge-text); color:var(--rose-badge-text);" onclick="submitAcquisition(${orderId}, 'Aborted')">Abort Study</button>
                `;
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }

        async function submitAcquisition(orderId, status) {
            if (status === 'Completed') {
                const idChecked = document.getElementById(`acq-idcheck-${orderId}`).checked;
                const studyChecked = document.getElementById(`acq-studycheck-${orderId}`).checked;
                if (!idChecked || !studyChecked) {
                    toast('Identity and study verification are required before marking acquisition complete', 'error');
                    return;
                }
            }
            try {
                await Api.patch(`${CCA_API}/imaging/orders/${orderId}/acquisition`, {
                    acquisition_status: status,
                    acquisition_modality: document.getElementById(`acq-modality-${orderId}`).value || undefined,
                    acquisition_protocol: document.getElementById(`acq-protocol-${orderId}`).value || undefined,
                    contrast_used: document.getElementById(`acq-contrast-${orderId}`).checked,
                    contrast_notes: document.getElementById(`acq-contrastnotes-${orderId}`).value || undefined,
                    technical_notes: document.getElementById(`acq-technotes-${orderId}`).value || undefined,
                    technical_issue: document.getElementById(`acq-issue-${orderId}`).value || undefined,
                });
                toast(status === 'Completed' ? 'Acquisition complete — sent to Radiologist' : 'Saved', 'success');
                loadTechnicalWorklist();
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }

        document.addEventListener('DOMContentLoaded', () => { loadTechnicalWorklist(); });
    </script>
</body>
</html>
