<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivana — Patient Financial Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F1F5F9; --bg-sidebar: #EEF2F6; --bg-surface: #FFFFFF; --bg-card-subtle: #F8FAFC;
            --ink-900: #0F172A; --ink-800: #1E293B; --ink-700: #334155; --ink-600: #475569; --ink-500: #64748B; --ink-400: #94A3B8; --ink-300: #CBD5E1;
            --line: #E2E8F0; --line-subtle: #F1F5F9;
            --brand-primary: #3B82F6; --brand-dark: #1E3A8A; --navy-action: #2A4365; --navy-action-hover: #1E3A8A;
            --green-badge-bg: #DCFCE7; --green-badge-text: #166534;
            --amber-badge-bg: #FEF3C7; --amber-badge-text: #92400E;
            --rose-badge-bg: #FFE4E6; --rose-badge-text: #9F1239;
            --blue-badge-bg: #E0E7FF; --blue-badge-text: #3730A3;
            --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05); --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-page); color: var(--ink-800); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
        .topbar { height: 64px; background: var(--bg-surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 20; }
        .brand-logo { font-size: 20px; font-weight: 700; color: var(--ink-900); letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .search-pill-container { flex: 1; max-width: 520px; margin: 0 32px; position: relative; }
        .search-pill-input { width: 100%; height: 40px; background: #F8FAFC; border: 1px solid var(--line); border-radius: var(--radius-full); padding: 0 16px 0 42px; font-size: 13.5px; color: var(--ink-900); outline: none; }
        .search-icon-fixed { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-400); font-size: 15px; pointer-events: none; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .icon-circle-btn { width: 38px; height: 38px; border-radius: var(--radius-full); border: 1px solid var(--line); background: var(--bg-surface); display: flex; align-items: center; justify-content: center; color: var(--ink-600); cursor: pointer; }
        .role-badge-pill { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #F8FAFC; border: 1px solid var(--line); border-radius: var(--radius-full); font-size: 13px; font-weight: 500; color: var(--ink-800); cursor: pointer; }
        .avatar-pill { width: 38px; height: 38px; border-radius: var(--radius-full); background: #E2E8F0; color: var(--ink-800); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; border: 1px solid var(--line); cursor: pointer; }
        .app-body { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; overflow-y: auto; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: var(--ink-400); text-transform: uppercase; padding: 10px 12px 6px; }
        .sidebar-nav-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 500; color: var(--ink-700); text-decoration: none; cursor: pointer; }
        .sidebar-nav-item:hover { background: rgba(255, 255, 255, 0.6); color: var(--ink-900); }
        .sidebar-nav-item.active { background: #FFFFFF; color: var(--ink-900); font-weight: 600; box-shadow: var(--shadow-sm); border: 1px solid rgba(226, 232, 240, 0.8); }
        .nav-item-left { display: flex; align-items: center; gap: 10px; }
        .nav-chevron { color: var(--ink-400); font-size: 12px; }
        .canvas { flex: 1; overflow-y: auto; padding: 28px 36px; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .page-title { font-size: 26px; font-weight: 700; color: var(--ink-900); letter-spacing: -0.5px; margin-bottom: 4px; }
        .page-subtitle { font-size: 13.5px; color: var(--ink-500); margin-bottom: 20px; }
        .section-card { background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title { font-size: 16px; font-weight: 700; color: var(--ink-900); }
        .section-sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
        .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; }
        .badge-green { background: var(--green-badge-bg); color: var(--green-badge-text); }
        .badge-amber { background: var(--amber-badge-bg); color: var(--amber-badge-text); }
        .badge-rose { background: var(--rose-badge-bg); color: var(--rose-badge-text); }
        .badge-blue { background: var(--blue-badge-bg); color: var(--blue-badge-text); }
        .btn-navy { background: var(--navy-action); color: #FFFFFF; font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius-sm); border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-navy:hover { background: var(--navy-action-hover); }
        .btn-outline { background: #FFFFFF; border: 1px solid var(--line); color: var(--ink-700); font-size: 12.5px; font-weight: 600; padding: 9px 14px; border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-outline:hover { border-color: var(--ink-400); background: #F8FAFC; }
        .worklist-row { background: var(--bg-card-subtle); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 10px; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; gap: 14px; align-items: center; }
        .wl-label { font-size: 11px; color: var(--ink-500); text-transform: uppercase; margin-bottom: 2px; }
        .wl-value { font-size: 13.5px; font-weight: 700; color: var(--ink-900); }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--ink-700); }
        .form-input, .form-select, .form-textarea { width: 100%; height: 38px; padding: 0 12px; background: #FFFFFF; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 13px; color: var(--ink-900); outline: none; }
        .form-textarea { height: auto; padding: 10px 12px; }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/patient_financial_services.html" class="brand-logo">Aivana</a>
        <div class="search-pill-container"><span class="search-icon-fixed">🔍</span><input type="text" class="search-pill-input" placeholder="Search patient or workflow" /></div>
        <div class="header-actions">
            <button class="icon-circle-btn" title="Notifications">🔔</button>
            <div class="role-badge-pill" onclick="location.href='/index.html'"><span>Financial Counsellor</span><span>▾</span></div>
            <div class="avatar-pill" title="Logged in">PF ▾</div>
        </div>
    </header>
    <div class="app-body">
        <aside class="sidebar">
            <div class="sidebar-section-title">PATIENT FINANCIAL SERVICES</div>
            <a class="sidebar-nav-item active" id="nav-patients" onclick="showTab('patients')"><div class="nav-item-left"><span>👤</span><span>Patients</span></div><span class="nav-chevron">›</span></a>
            <a class="sidebar-nav-item" id="nav-financial" onclick="showTab('financial')"><div class="nav-item-left"><span>💳</span><span>Financial Worklist</span></div><span class="nav-chevron">›</span></a>
        </aside>
        <main class="canvas">

            <div id="view-patients" class="view-panel active">
                <h1 class="page-title">Patients</h1>
                <p class="page-subtitle">Patients referred for financial counselling</p>
                <div class="section-card">
                    <div class="section-head"><div class="section-title">Patient Census</div><span class="badge badge-blue" id="patient-count">0 patients</span></div>
                    <div id="patient-list"></div>
                </div>
            </div>

            <div id="view-financial" class="view-panel">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div><h1 class="page-title">Financial Worklist</h1><p class="page-subtitle">Read-only clinical context; counsellor cannot edit diagnosis, stage, or treatment plan.</p></div>
                    <button class="btn-navy" onclick="submitCreateCase()">+ Refer Patient</button>
                </div>
                <div id="financial-content"><!-- Populated via JS: loadFinancialQueue() --></div>
            </div>

        </main>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        const ccaUser = Auth.requirePage(['CCAFinancialCounsellor', 'Billing', 'Admin']);
        const CCA_API = '/cca';
        let currentPatientId = null;

        function showTab(tab) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
            if (tab === 'patients') loadPatientQueue();
            if (tab === 'financial') loadFinancialQueue();
        }

        async function loadPatientQueue() {
            const listEl = document.getElementById('patient-list');
            try {
                const data = await Api.get(`${CCA_API}/patients`);
                document.getElementById('patient-count').textContent = `${data.results.length} patients`;
                listEl.innerHTML = data.results.map(p => `
                    <div class="worklist-row" style="grid-template-columns: 1.4fr 1fr 1fr 0.8fr auto;">
                        <div><div class="wl-label">Patient</div><div class="wl-value">${escapeHtml(p.name)}</div><div style="font-size:12px;color:var(--ink-500);">${escapeHtml(p.mrn)}</div></div>
                        <div><div class="wl-label">Age/Sex</div><div class="wl-value" style="font-size:13px;">${escapeHtml(String(p.age))}y / ${escapeHtml(p.sex)}</div></div>
                        <div><div class="wl-label">Journey</div><div class="wl-value" style="font-size:13px;">${escapeHtml(p.journey_state)}</div></div>
                        <div><span class="badge ${p.staging_state === 'CLINICIAN_CONFIRMED' ? 'badge-green' : 'badge-amber'}">${escapeHtml(p.staging_state)}</span></div>
                        <div><button class="btn-navy" onclick="openPatient(${Number(p.id)})">Open →</button></div>
                    </div>
                `).join('') || '<p style="color:var(--ink-500); font-size:13px;">No patients.</p>';
            } catch (err) { listEl.innerHTML = `<p style="color:var(--rose-badge-text); font-size:13px;">${escapeHtml(apiErrorMessage(err))}</p>`; }
        }

        function openPatient(id) { currentPatientId = id; showTab('financial'); }

        async function submitCreateCase() {
            if (!currentPatientId) { toast('Open a patient from the Patients list first', 'error'); return; }
            try {
                await Api.post(`${CCA_API}/financial/cases`, { patient_id: currentPatientId });
                toast('Financial case created', 'success');
                loadFinancialQueue();
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }

        async function loadFinancialQueue() {
            const container = document.getElementById('financial-content');
            try {
                const data = await Api.get(`${CCA_API}/financial/queue`);
                container.innerHTML = `<div class="section-card"><div class="section-title" style="margin-bottom:14px;">Financial Cases</div>` +
                    (data.queue.length ? data.queue.map(f => `
                        <div class="worklist-row">
                            <div><div class="wl-label">Patient</div><div class="wl-value">${escapeHtml(f.patient_name)}</div><div style="font-size:12px;color:var(--ink-500);">${escapeHtml(f.patient_mrn)}</div></div>
                            <div><div class="wl-label">Counselling</div><div class="wl-value" style="font-size:13px;">${escapeHtml(f.counselling_status)}</div></div>
                            <div><div class="wl-label">Estimate</div><div class="wl-value" style="font-size:13px;">${escapeHtml(f.estimate_status || 'NotStarted')}</div></div>
                            <div><span class="badge badge-blue">${escapeHtml(f.financial_clearance_status)}</span></div>
                            <div><button class="btn-navy" onclick="openFinancialCase(${Number(f.id)})">Manage</button></div>
                        </div>
                        <div id="fin-detail-${f.id}"></div>
                    `).join('') : '<p style="color:var(--ink-500); font-size:13px;">No financial cases.</p>') + `</div>`;
            } catch (err) { container.innerHTML = `<div class="section-card"><p style="color:var(--rose-badge-text); font-size:13px;">${escapeHtml(apiErrorMessage(err))}</p></div>`; }
        }

        async function openFinancialCase(caseId) {
            const detail = document.getElementById(`fin-detail-${caseId}`);
            try {
                const data = await Api.get(`${CCA_API}/financial/cases/${caseId}`);
                const f = data.case;
                detail.innerHTML = `
                    <div class="section-card" style="margin-top:8px;">
                        <div class="section-title" style="font-size:14px; margin-bottom:8px;">Counselling</div>
                        <div class="form-group"><textarea id="fin-notes-${caseId}" class="form-textarea" rows="2" placeholder="Counselling notes">${escapeHtml(f.counselling_notes || '')}</textarea></div>
                        <div class="form-group"><select id="fin-status-${caseId}" class="form-select">${['Pending','InProgress','Completed','FollowUpRequired'].map(s => `<option ${f.counselling_status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                        <button class="btn-outline" onclick="submitCounselling(${caseId})">💾 Save Counselling</button>

                        <hr style="margin:16px 0; border:none; border-top:1px solid var(--line);" />
                        <div class="section-title" style="font-size:14px; margin-bottom:8px;">Estimate</div>
                        <div class="form-group"><select id="fin-estimate-status-${caseId}" class="form-select">${['NotStarted','Draft','Ready','Shared','Revised','Accepted','Expired'].map(s => `<option ${f.estimate_status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                        <button class="btn-outline" onclick="submitEstimate(${caseId})">💾 Save Estimate Status</button>

                        <hr style="margin:16px 0; border:none; border-top:1px solid var(--line);" />
                        <div class="section-title" style="font-size:14px; margin-bottom:8px;">Payer Route</div>
                        <div class="form-group"><select id="fin-payer-${caseId}" class="form-select">${['SelfPay','PrivateInsurance','CorporateTPA','GovernmentScheme','Assistance'].map(s => `<option ${f.payer_route === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                        <button class="btn-outline" onclick="submitInsurance(${caseId})">💾 Save Payer Route</button>

                        <hr style="margin:16px 0; border:none; border-top:1px solid var(--line);" />
                        <div class="section-title" style="font-size:14px; margin-bottom:8px;">Financial Clearance</div>
                        <div class="form-group"><select id="fin-clearance-${caseId}" class="form-select">${['NotStarted','PendingDocuments','InsuranceApprovalPending','PatientContributionPending','PartiallyCleared','Cleared','NotCleared','Deferred'].map(s => `<option ${f.financial_clearance_status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                        <button class="btn-navy" onclick="submitClearance(${caseId})">✅ Save Clearance</button>
                    </div>
                `;
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }

        async function submitCounselling(caseId) {
            try {
                await Api.patch(`${CCA_API}/financial/cases/${caseId}/counselling`, { counselling_status: document.getElementById(`fin-status-${caseId}`).value, counselling_notes: document.getElementById(`fin-notes-${caseId}`).value });
                toast('Counselling updated', 'success');
                loadFinancialQueue();
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }
        async function submitEstimate(caseId) {
            try {
                await Api.patch(`${CCA_API}/financial/cases/${caseId}/estimate`, { estimate_status: document.getElementById(`fin-estimate-status-${caseId}`).value });
                toast('Estimate status updated', 'success');
                loadFinancialQueue();
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }
        async function submitInsurance(caseId) {
            try {
                await Api.patch(`${CCA_API}/financial/cases/${caseId}/insurance`, { payer_route: document.getElementById(`fin-payer-${caseId}`).value });
                toast('Payer route updated', 'success');
                loadFinancialQueue();
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }
        async function submitClearance(caseId) {
            try {
                await Api.patch(`${CCA_API}/financial/cases/${caseId}/clearance`, { financial_clearance_status: document.getElementById(`fin-clearance-${caseId}`).value });
                toast('Clearance status updated', 'success');
                loadFinancialQueue();
            } catch (err) { toast(apiErrorMessage(err), 'error'); }
        }

        document.addEventListener('DOMContentLoaded', () => { loadPatientQueue(); });
    </script>
</body>
</html>
