<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIVANA Hospital - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
                * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #FBFAF7; color: #1C2621; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #2F6F52, #2F6F52); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-header p { color: #667169; font-size: 14px; margin-top: 4px; }
        .login-box { background: #FFFFFF; border: 1px solid #E6E7E2; border-radius: 16px; padding: 30px; }
        .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 12px; background: #F3F2EE; border: 1px solid #E6E7E2; border-radius: 10px; color: #1C2621; font-size: 14px; outline: none; }
        .login-box input:focus { border-color: #2F6F52; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #2F6F52, #234E39); border: none; border-radius: 10px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .error { color: #C1694F; font-size: 13px; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>🏥 AIVANA Hospital</h1>
        <p>Unified Clinical Portal</p>
    </div>
    <div class="login-box">
        <form id="login-form">
            <input type="email" id="login-email" placeholder="name@aivana.com" required />
            <input type="password" id="login-password" placeholder="Password" required />
            <button type="submit" class="btn-primary">Sign In</button>
            <div id="login-error" class="error"></div>
        </form>
    </div>
</div>
<script src="/static/js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';
    try {
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
            errorEl.textContent = data.detail || 'Login failed';
            return;
        }
        // Regression fix: this used to only store access_token/refresh_token, never the
        // 'hms_user' key every Auth.requirePage()-gated page (pharmacy/billing/inventory/
        // frontdesk/tpa/cca_os) reads via Auth.getUser() -- meaning every one of those pages
        // was unreachable after a real login (Auth.getUser() always returned null, so
        // requirePage() always redirected straight back here). Also replaces the hardcoded,
        // separately-maintained role->page redirect chain (which never knew about the CCA
        // Oncology OS roles at all) with api.js's single ROLE_HOME source of truth.
        Auth.setSession(data.access_token, data.refresh_token, data.user);
        window.location.href = Auth.homeFor(data.user.role);
    } catch(err) {
        errorEl.textContent = 'Network error';
    }
});
</script>

</body>
</html>
